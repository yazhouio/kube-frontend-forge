name: Docker Image

on:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  build-image-by-arch:
    name: Build and push images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            cache_scope: frontend-forge-image-amd64
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: frontend-forge-image-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Generate bake definition
        env:
          CACHE_SCOPE: ${{ matrix.cache_scope }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");

          const platform = process.env.TARGET_PLATFORM;
          const cacheScope = process.env.CACHE_SCOPE;
          const targets = ["job-prod", "job-debug", "server-prod", "server-debug"];
          const targetConfig = {
            "job-prod": "spike2044/frontend-forge-job",
            "job-debug": "spike2044/frontend-forge-job",
            "server-prod": "spike2044/frontend-forge-server",
            "server-debug": "spike2044/frontend-forge-server",
          };

          const bake = {
            group: {
              default: {
                targets,
              },
            },
            target: {},
          };

          for (const target of targets) {
            bake.target[target] = {
              context: ".",
              dockerfile: "crates/forge-job/Dockerfile",
              target,
              platforms: [platform],
              output: [
                `type=image,name=${targetConfig[target]},push-by-digest=true,name-canonical=true,push=true`,
              ],
              "cache-from": [`type=gha,scope=${cacheScope}`],
              "cache-to": [`type=gha,mode=max,scope=${cacheScope}`],
              secret: ["id=npm_auth_base64,env=NPM_AUTH_BASE64"],
            };
          }

          fs.writeFileSync("docker-bake.generated.json", JSON.stringify(bake, null, 2));
          NODE

      - name: Build and push images by digest
        env:
          NPM_AUTH_BASE64: ${{ secrets.NPM_AUTH_BASE64 }}
        run: |
          set -euo pipefail
          docker buildx bake \
            --file docker-bake.generated.json \
            --metadata-file docker-bake.metadata.json

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p digests

          node <<'NODE'
          const fs = require("node:fs");

          const arch = process.env.ARCH;
          const metadata = JSON.parse(fs.readFileSync("docker-bake.metadata.json", "utf8"));
          const targets = ["job-prod", "job-debug", "server-prod", "server-debug"];

          for (const target of targets) {
            const targetMetadata = metadata[target];
            const digest =
              targetMetadata?.["containerimage.digest"] ??
              targetMetadata?.["containerimage.descriptor"]?.digest;
            if (!digest) {
              throw new Error(`Missing image digest for ${target}`);
            }
            fs.writeFileSync(`digests/${target}-${arch}.txt`, `${digest}\n`);
          }
          NODE
        env:
          ARCH: ${{ matrix.arch }}

      - name: Upload digest artifact
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*.txt

  merge-manifests:
    name: Merge multi-arch image (${{ matrix.image }}:${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [build-image-by-arch]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: spike2044/frontend-forge-job
            target: job-prod
            tag_suffix: ""
            latest_suffix: ""
          - image: spike2044/frontend-forge-job
            target: job-debug
            tag_suffix: "-debug"
            latest_suffix: "-debug"
          - image: spike2044/frontend-forge-server
            target: server-prod
            tag_suffix: ""
            latest_suffix: ""
          - image: spike2044/frontend-forge-server
            target: server-debug
            tag_suffix: "-debug"
            latest_suffix: "-debug"
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}${{ matrix.tag_suffix }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest${{ matrix.latest_suffix }},enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=ref,event=branch,suffix=${{ matrix.tag_suffix }},enable=${{ github.event_name == 'push' }}
            type=sha,prefix={{branch}}-,suffix=${{ matrix.tag_suffix }},enable=${{ github.event_name == 'push' }}

      - name: Download digest artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true

      - name: Create and push manifest
        shell: bash
        run: |
          set -euo pipefail

          amd_digest="$(cat "digests/${{ matrix.target }}-amd64.txt")"
          arm_digest="$(cat "digests/${{ matrix.target }}-arm64.txt")"

          tags=()
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tags+=("$tag")
              tag_args+=("-t" "$tag")
            fi
          done <<< "${{ steps.meta.outputs.tags }}"

          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "metadata-action did not produce any tags" >&2
            exit 1
          fi

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${{ matrix.image }}@${amd_digest}" \
            "${{ matrix.image }}@${arm_digest}"

          primary_tag="${tag_args[1]}"
          image_digest="$(docker buildx imagetools inspect "$primary_tag" | sed -n 's/^Digest: //p' | head -n1)"
          joined_tags="$(printf '%s<br>' "${tags[@]}")"
          joined_tags="${joined_tags%<br>}"
          {
            echo "## Multi-platform image"
            echo
            echo "| Image | Target | Tags | Digest |"
            echo "| --- | --- | --- | --- |"
            echo "| ${{ matrix.image }} | ${{ matrix.target }} | ${joined_tags} | \`${image_digest}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
