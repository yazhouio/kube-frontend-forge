name: Docker Image

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

env:
  DOCKER_PR_PLATFORMS: linux/amd64

jobs:
  build-pr-image:
    name: Build PR image (${{ matrix.image }}:${{ matrix.target }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - image: spike2044/frontend-forge-job
            target: dev
            variant: dev
          - image: spike2044/frontend-forge-server
            target: server-dev
            variant: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }}:${{ matrix.variant }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/forge-job/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ env.DOCKER_PR_PLATFORMS }}
          push: false
          tags: ${{ matrix.image }}:pr-${{ github.event.pull_request.number }}-${{ matrix.variant }}
          cache-from: type=gha,scope=frontend-forge-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=frontend-forge-${{ matrix.target }}
          secrets: |
            npm_auth_base64=${{ secrets.NPM_AUTH_BASE64 }}

  build-image-by-arch:
    name: Build and push image (${{ matrix.image }}:${{ matrix.target }}:${{ matrix.arch }})
    if: github.event_name == 'release' || github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: spike2044/frontend-forge-job
            target: prod
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - image: spike2044/frontend-forge-job
            target: dev
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - image: spike2044/frontend-forge-server
            target: server-prod
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - image: spike2044/frontend-forge-server
            target: server-dev
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - image: spike2044/frontend-forge-job
            target: prod
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: spike2044/frontend-forge-job
            target: dev
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: spike2044/frontend-forge-server
            target: server-prod
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: spike2044/frontend-forge-server
            target: server-dev
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push ${{ matrix.image }} by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/forge-job/Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=frontend-forge-${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-forge-${{ matrix.target }}-${{ matrix.arch }}
          secrets: |
            npm_auth_base64=${{ secrets.NPM_AUTH_BASE64 }}

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.target }}-${{ matrix.arch }}.txt"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: digests/*.txt

  merge-manifests:
    name: Merge multi-arch image (${{ matrix.image }}:${{ matrix.target }})
    if: github.event_name == 'release' || github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-image-by-arch]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: spike2044/frontend-forge-job
            target: prod
            tag_suffix: ""
            latest_suffix: ""
          - image: spike2044/frontend-forge-job
            target: dev
            tag_suffix: "-dev"
            latest_suffix: "-dev"
          - image: spike2044/frontend-forge-server
            target: server-prod
            tag_suffix: ""
            latest_suffix: ""
          - image: spike2044/frontend-forge-server
            target: server-dev
            tag_suffix: "-dev"
            latest_suffix: "-dev"
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}${{ matrix.tag_suffix }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest${{ matrix.latest_suffix }},enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=ref,event=branch,suffix=${{ matrix.tag_suffix }},enable=${{ github.event_name == 'push' }}
            type=sha,prefix={{branch}}-,suffix=${{ matrix.tag_suffix }},enable=${{ github.event_name == 'push' }}

      - name: Download digest artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.target }}-*
          path: digests
          merge-multiple: true

      - name: Create and push manifest
        shell: bash
        run: |
          set -euo pipefail

          amd_digest="$(cat "digests/${{ matrix.target }}-amd64.txt")"
          arm_digest="$(cat "digests/${{ matrix.target }}-arm64.txt")"

          tags=()
          tag_args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tags+=("$tag")
              tag_args+=("-t" "$tag")
            fi
          done <<< "${{ steps.meta.outputs.tags }}"

          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "metadata-action did not produce any tags" >&2
            exit 1
          fi

          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${{ matrix.image }}@${amd_digest}" \
            "${{ matrix.image }}@${arm_digest}"

          primary_tag="${tag_args[1]}"
          image_digest="$(docker buildx imagetools inspect "$primary_tag" | sed -n 's/^Digest: //p' | head -n1)"
          joined_tags="$(printf '%s<br>' "${tags[@]}")"
          joined_tags="${joined_tags%<br>}"
          {
            echo "## Multi-platform image"
            echo
            echo "| Image | Target | Tags | Digest |"
            echo "| --- | --- | --- | --- |"
            echo "| ${{ matrix.image }} | ${{ matrix.target }} | ${joined_tags} | \`${image_digest}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
