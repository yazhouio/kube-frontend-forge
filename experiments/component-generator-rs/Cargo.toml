[package]
name = "component-generator-rs"
version = "0.1.0"
edition = "2024"

[features]
default = []
swc = [
  "dep:swc_common",
  "dep:swc_ecma_ast",
  "dep:swc_ecma_codegen",
  "dep:swc_ecma_parser",
  "dep:swc_ecma_visit",
]

[dependencies]
indexmap = "2.7"
jsonschema = { version = "0.46.5", default-features = false }
oxc_allocator = "0.134.0"
oxc_ast = "0.134.0"
oxc_ast_visit = "0.134.0"
oxc_codegen = { version = "0.134.0", default-features = false }
oxc_parser = "0.134.0"
oxc_span = "0.134.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snafu = "0.8"
swc_common = { version = "23.0.0", optional = true }
swc_ecma_ast = { version = "25.0.0", optional = true }
swc_ecma_codegen = { version = "28.0.0", optional = true }
swc_ecma_parser = { version = "41.0.0", optional = true }
swc_ecma_visit = { version = "25.0.0", optional = true }
