pre-commit:
  commands:
    check-schemas:
      run: cargo run -p xtask -- check-schemas
    fmt:
      run: cargo run -p xtask -- fmt --check
    clippy:
      run: cargo run -p xtask -- clippy
commit-msg:
  commands:
    commit-msg:
      run: cargo run -p xtask -- commit-msg {1}
pre-push:
  commands:
    verify:
      run: cargo run -p xtask -- verify
